<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bashubb — Independent Apps for iPhone</title>
  <meta name="description" content="One job. Good user experience. Independent iPhone apps by Bashubb. Discover Shrink and get a first look at Mirrorly.">
  <link rel="canonical" href="https://bashubb.com/">
  <meta name="theme-color" content="#000000">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Bashubb">
  <meta property="og:title" content="Bashubb — Independent Apps for iPhone">
  <meta property="og:description" content="One job. Good user experience.">
  <meta property="og:url" content="https://bashubb.com/">
  <link rel="icon" href="assets/bashubb-logo.png" type="image/png">
  <link rel="apple-touch-icon" href="assets/bashubb-logo.png">
  <link rel="stylesheet" href="assets/site.css">
  <script src="assets/site.js" defer></script>
  <script type="application/ld+json">{"@context":"https://schema.org","@type":"Organization","name":"Bashubb","url":"https://bashubb.com/"}</script>
  <script type="application/ld+json">{"@context":"https://schema.org","@type":"WebSite","name":"Bashubb","url":"https://bashubb.com/"}</script>
</head>
<body>
  <a class="skip" href="#main">Skip to apps</a>
  <header class="site-header">
    <a class="brand" href="/" aria-label="Bashubb home"><img src="assets/bashubb-logo.png" width="40" height="40" alt=""><span>bashubb</span></a>
    <h1>One job. <span>Good user experience.</span></h1>
  </header>

  <main id="main">
    <div class="dock" role="tablist" aria-label="Choose an app">
      <button class="dock-app" id="tab-shrink" type="button" role="tab" aria-selected="false" aria-controls="panel-shrink" tabindex="-1" data-app="shrink">
        <img src="assets/shrink-icon.webp" width="56" height="56" alt="">
        <span class="app-name">Shrink</span>
        <span class="app-status">Available now</span>
      </button>
      <button class="dock-app" id="tab-mirrorly" type="button" role="tab" aria-selected="true" aria-controls="panel-mirrorly" data-app="mirrorly">
        <img src="assets/mirrorly-icon.png" width="56" height="56" alt="">
        <span class="app-name">Mirrorly</span>
        <span class="app-status">Coming soon</span>
      </button>
    </div>

    <div class="stage">
      <section class="app-panel mirrorly-panel" id="panel-mirrorly" role="tabpanel" aria-labelledby="tab-mirrorly" tabindex="0">
        <div class="film">
          <video autoplay muted loop playsinline preload="metadata" poster="assets/mirrorly-poster.jpg" aria-label="Mirrorly preview">
            <source src="assets/mirrorly-teaser.mp4" type="video/mp4">
          </video>
          <button class="playback" type="button" aria-label="Pause preview" hidden>
            <svg class="pause-icon" width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 5h3v14H7zm7 0h3v14h-3z"/></svg>
            <svg class="play-icon" width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="m8 5 11 7-11 7z"/></svg>
          </button>
        </div>
      </section>

      <section class="app-panel shrink-panel" id="panel-shrink" role="tabpanel" aria-labelledby="tab-shrink" tabindex="0" hidden>
        <div class="shrink-content">
          <img class="product-icon" src="assets/shrink-icon.webp" width="96" height="96" alt="">
          <h2>Less size.<br>More space.</h2>
          <p>Photos that fit your limit.<br>Compressed on your iPhone.</p>
          <div class="actions">
            <a class="primary-link" href="https://apps.apple.com/app/id6804833389">Get Shrink <span aria-hidden="true">↗</span></a>
            <a class="secondary-link" href="/shrink/">Explore the app <span aria-hidden="true">↗</span></a>
          </div>
        </div>
      </section>
    </div>
    <noscript><p class="fallback">Shrink is available for iPhone. <a href="/shrink/">Explore Shrink ↗</a></p></noscript>
  </main>

  <footer>
    <button class="email-copy" type="button" aria-label="Copy email address bashubb.dev@gmail.com" title="Copy email address">
      <span class="email-address">bashubb.dev@gmail.com</span>
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="8" y="8" width="12" height="12" rx="3"/><path d="M15 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h2"/></svg>
    </button>
    <span class="copy-status" role="status" aria-live="polite"></span>
  </footer>
</body>
</html>
